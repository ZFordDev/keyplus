name: Build KeyPlus Snap

on:
  workflow_call:
  pull_request:
    paths:
      - .github/workflows/build-snap.yml
      - snap/**
      - pyproject.toml
      - src/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build committed Snapcraft project
        uses: snapcore/action-build@v1
        id: snapcraft
      - name: Inspect package metadata and commands
        run: |
          unsquashfs -cat "${{ steps.snapcraft.outputs.snap }}" meta/snap.yaml > /tmp/keyplus-snap.yaml
          grep -F 'name: keyplus' /tmp/keyplus-snap.yaml
          grep -F 'confinement: strict' /tmp/keyplus-snap.yaml
          grep -F 'command: bin/keyplus' /tmp/keyplus-snap.yaml
          grep -F 'command: bin/keyplus-gui' /tmp/keyplus-snap.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: keyplus-snap
          path: ${{ steps.snapcraft.outputs.snap }}
